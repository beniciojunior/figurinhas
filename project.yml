name: Figurinhas
options:
  bundleIdPrefix: com.figurinhas
  deploymentTarget:
    iOS: "18.0"
  xcodeVersion: "16.2"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.10"
    TARGETED_DEVICE_FAMILY: "1"
    SUPPORTED_PLATFORMS: "iphoneos iphonesimulator"

targets:
  Figurinhas:
    type: application
    platform: iOS
    sources:
      - path: Figurinhas
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.figurinhas.app
        INFOPLIST_FILE: Figurinhas/Resources/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    info:
      path: Figurinhas/Resources/Info.plist
      properties:
        CFBundleName: Figurinhas
        CFBundleDisplayName: Figurinhas Copa 2026
        CFBundleIdentifier: com.figurinhas.app
        CFBundleVersion: "1"
        CFBundleShortVersionString: "1.0"
        NSCameraUsageDescription: "Para escanear suas figurinhas da Copa do Mundo 2026"
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UILaunchScreen:
          UIColorName: AccentColor
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
          UISceneConfigurations: {}
